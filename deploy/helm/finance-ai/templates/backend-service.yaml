apiVersion: v1
kind: Service
metadata:
  name: {{ include "finance-ai.backendFullname" . }}
  labels:
    {{- include "finance-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "finance-ai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
