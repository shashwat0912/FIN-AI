# Development-only PostgreSQL. Production uses an external managed database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: finance-ai-local
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: finance-ai-local
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: finance-ai
    app.kubernetes.io/managed-by: local-validation
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: finance-ai-local
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: finance-ai-local
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: finance-ai
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: finance-ai-local-postgres
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: finance-ai-local
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: finance-ai-local
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: finance-ai
    app.kubernetes.io/managed-by: local-validation
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: finance-ai-local
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
