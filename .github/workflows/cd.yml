name: CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after publishing images
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE_NAME: frontend
  BACKEND_IMAGE_NAME: backend

jobs:
  publish:
    name: Build and Publish Images
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      image_namespace: ${{ steps.names.outputs.image_namespace }}
      frontend_image: ${{ steps.names.outputs.frontend_image }}
      backend_image: ${{ steps.names.outputs.backend_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image names
        id: names
        shell: bash
        run: |
          image_namespace="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "image_namespace=${image_namespace}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${image_namespace}/${FRONTEND_IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${image_namespace}/${BACKEND_IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Frontend metadata
        id: frontend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.frontend_image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=long

      - name: Backend metadata
        id: backend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.backend_image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=long

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '/api/v1' }}
          tags: ${{ steps.frontend_meta.outputs.tags }}
          labels: ${{ steps.frontend_meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.backend_meta.outputs.tags }}
          labels: ${{ steps.backend_meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy-config:
    name: Check Deploy Configuration
    runs-on: ubuntu-latest
    needs: publish
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Check required secrets
        id: check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "workflow_dispatch" || "${{ inputs.deploy }}" != "true" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing=()
          [[ -n "$DEPLOY_HOST" ]] || missing+=("DEPLOY_HOST")
          [[ -n "$DEPLOY_USER" ]] || missing+=("DEPLOY_USER")
          [[ -n "$DEPLOY_SSH_KEY" ]] || missing+=("DEPLOY_SSH_KEY")

          if (( ${#missing[@]} )); then
            echo "::error title=Missing deployment secrets::deploy=true requires: ${missing[*]}"
            exit 1
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    needs:
      - publish
      - deploy-config
    if: needs.deploy-config.outputs.enabled == 'true'
    timeout-minutes: 15

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PATH: /home/ubuntu/apps/FIN-AI
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_USER: ${{ github.actor }}
      FRONTEND_IMAGE: ${{ needs.publish.outputs.frontend_image }}:sha-${{ github.sha }}
      BACKEND_IMAGE: ${{ needs.publish.outputs.backend_image }}:sha-${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Copy deployment manifest
        shell: bash
        run: |
          remote_manifest="$DEPLOY_PATH/.docker-compose.prod.yml.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT.tmp"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_manifest"

      - name: Deploy release
        shell: bash
        run: |
          remote_manifest="$DEPLOY_PATH/.docker-compose.prod.yml.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT.tmp"

          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' REMOTE_MANIFEST='$remote_manifest' FRONTEND_IMAGE='$FRONTEND_IMAGE' BACKEND_IMAGE='$BACKEND_IMAGE' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_PATH"
          mv "$REMOTE_MANIFEST" docker-compose.prod.yml

          printf 'FRONTEND_IMAGE=%s\nBACKEND_IMAGE=%s\n' \
            "$FRONTEND_IMAGE" "$BACKEND_IMAGE" > .release.env

          set -a
          . ./.release.env
          set +a

          compose=(docker compose -f docker-compose.prod.yml)
          "${compose[@]}" config --quiet
          "${compose[@]}" pull backend frontend
          "${compose[@]}" up -d --no-deps --no-build backend frontend

          fail() {
            echo "::error::$1"
            "${compose[@]}" ps --all backend frontend || true
            exit 1
          }

          backend_id="$("${compose[@]}" ps --all --quiet backend)"
          frontend_id="$("${compose[@]}" ps --all --quiet frontend)"
          [[ -n "$backend_id" ]] || fail "Backend container does not exist"
          [[ -n "$frontend_id" ]] || fail "Frontend container does not exist"

          actual_backend_image="$(docker inspect --format '{{.Config.Image}}' "$backend_id")"
          actual_frontend_image="$(docker inspect --format '{{.Config.Image}}' "$frontend_id")"
          [[ "$actual_backend_image" == "$BACKEND_IMAGE" ]] || \
            fail "Backend image mismatch: expected $BACKEND_IMAGE, got $actual_backend_image"
          [[ "$actual_frontend_image" == "$FRONTEND_IMAGE" ]] || \
            fail "Frontend image mismatch: expected $FRONTEND_IMAGE, got $actual_frontend_image"

          for attempt in {1..60}; do
            backend_state="$(docker inspect --format '{{.State.Status}}' "$backend_id")"
            frontend_state="$(docker inspect --format '{{.State.Status}}' "$frontend_id")"
            [[ "$backend_state" == running ]] || fail "Backend container state is $backend_state"
            [[ "$frontend_state" == running ]] || fail "Frontend container state is $frontend_state"

            backend_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$backend_id")"
            frontend_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$frontend_id")"
            if [[ "$backend_health" == healthy && "$frontend_health" == healthy ]]; then
              echo "Deployment verified: backend and frontend use the requested images and are healthy"
              exit 0
            fi

            sleep 5
          done

          fail "Health check timed out: backend=$backend_health frontend=$frontend_health"
          REMOTE
