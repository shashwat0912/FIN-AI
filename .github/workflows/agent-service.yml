name: Agent Platform
on:
  pull_request:
  push:
    branches: [main, master, feat/agentic-cloud-ops]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent-service
    env:
      AGENT_DATA_MODE: simulation
      AGENT_LLM_PROVIDER: mock
      AGENT_WRITE_ACTIONS_ENABLED: 'false'
      OPENAI_API_KEY: ''
      AWS_EC2_METADATA_DISABLED: 'true'
      AGENT_TEST_DATABASE_URL: postgresql://financeai_test@localhost:5432/finance_ai_test
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: finance_ai_test
          POSTGRES_USER: financeai_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U financeai_test -d finance_ai_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent-service/requirements*.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Format and lint
        run: |
          ruff format --check .
          ruff check .
      - name: Typecheck
        run: mypy app
      - name: Unit, policy, MCP and PostgreSQL tests
        run: pytest tests -q
      - name: Evaluate synthetic incidents (no paid APIs)
        run: python -m app.evals.run > evaluation.json
      - uses: actions/upload-artifact@v4
        with:
          name: agent-evaluation
          path: agent-service/evaluation.json
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Optional Helm component and policy checks
        run: python ../scripts/test-agent-helm.py
      - uses: docker/setup-buildx-action@v3
      - name: Build agent image
        uses: docker/build-push-action@v6
        with:
          context: agent-service
          push: false
          load: true
          tags: finance-ai-agent:ci
          no-cache-filters: base
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent
      - name: Scan agent image (existing HIGH/CRITICAL gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: finance-ai-agent:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          scanners: vuln
      - name: Generate agent SBOM (inventory only; vulnerability gate above is unchanged)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: finance-ai-agent:ci
          format: cyclonedx
          output: agent-service/agent-sbom.cdx.json
          scanners: vuln
          exit-code: '0'
      - uses: actions/upload-artifact@v4
        with:
          name: agent-sbom
          path: agent-service/agent-sbom.cdx.json
