# Local development only. These values are intentionally non-production.
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: finance-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance_ai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-only-postgres-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Optional - for caching and rate limiting)
  redis:
    image: redis:7-alpine
    container_name: finance-ai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  api:
    build: .
    container_name: finance-ai-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:local-only-postgres-password@postgres:5432/finance_ai_db?schema=public
      JWT_SECRET: local-test-only-jwt-secret-local-test-only-jwt-secret-local-test-only
      JWT_REFRESH_SECRET: local-test-only-refresh-secret-local-test-only-refresh-secret-local
      CORS_ORIGIN: http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
